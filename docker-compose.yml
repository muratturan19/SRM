services:
  operon_crm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: operon_crm
    environment:
      - PORTAL_URL=https://portal.kolektif360.com
      - PORTAL_ISSUER=https://portal.kolektif360.com
      - PORTAL_APP_SLUG=srm
      - DATABASE_HOST=operon_crm_postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=${DB_PASSWORD}
      - SCAN_PROVIDER=claude
      - VOICE_LLM_PROVIDER=claude
    volumes:
      - operon_crm_uploads:/app/uploads
    restart: unless-stopped
    depends_on:
      operon_crm_postgres:
        condition: service_healthy
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.operon-crm.rule=Host(`operon-crm.kolektif360.com`)"
      - "traefik.http.routers.operon-crm.entrypoints=websecure"
      - "traefik.http.routers.operon-crm.tls.certresolver=letsencrypt"
      - "traefik.http.services.operon-crm.loadbalancer.server.port=8000"
      - "traefik.http.routers.operon-crm-http.rule=Host(`operon-crm.kolektif360.com`)"
      - "traefik.http.routers.operon-crm-http.entrypoints=web"
      - "traefik.http.routers.operon-crm-http.middlewares=operon-crm-https-redirect"
      - "traefik.http.middlewares.operon-crm-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.operon-crm-legacy.rule=Host(`srm.kolektif360.com`)"
      - "traefik.http.routers.operon-crm-legacy.entrypoints=websecure"
      - "traefik.http.routers.operon-crm-legacy.tls.certresolver=letsencrypt"
      - "traefik.http.routers.operon-crm-legacy-http.rule=Host(`srm.kolektif360.com`)"
      - "traefik.http.routers.operon-crm-legacy-http.entrypoints=web"
      - "traefik.http.routers.operon-crm-legacy-http.middlewares=operon-crm-legacy-https-redirect"
      - "traefik.http.middlewares.operon-crm-legacy-https-redirect.redirectscheme.scheme=https"
      # portal-auth EKLEME — SSO akışını kırar

  operon_crm_postgres:
    image: postgres:15
    container_name: operon_crm_postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=postgres
    volumes:
      - operon_crm_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - web
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  operon_crm_uploads:
    name: srm_srm_uploads
  operon_crm_pgdata:
    name: srm_srm_pgdata

networks:
  web:
    external: true
